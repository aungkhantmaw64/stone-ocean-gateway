# Development variant of the gateway distro: the same image, but the SD card
# only carries U-Boot and a boot script that fetches the kernel over TFTP and
# mounts the root filesystem over NFS (see scripts/netboot.sh).
# Board-independent: the board's kas file picks the partition layout.
require conf/distro/stone-ocean.conf

DISTRO = "stone-ocean-dev"
DISTRO_NAME = "Stone Ocean Gateway (netboot)"

# Keeps every :stone-ocean override of the production distro.
DISTROOVERRIDES = "stone-ocean:stone-ocean-dev"

# Host that serves TFTP and NFS; written by scripts/build.sh --dev.
STONE_OCEAN_NETBOOT_SERVER ??= ""

IMAGE_BOOT_FILES:append = " boot.scr netboot.txt"
do_image_wic[depends] += "stone-ocean-netboot:do_deploy"
