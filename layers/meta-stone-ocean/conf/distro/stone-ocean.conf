# Stone Ocean gateway distro: Poky with systemd and only the features a
# headless BLE mesh gateway needs. Board-independent: nothing here names a
# machine.
require conf/distro/poky.conf

DISTRO = "stone-ocean"
DISTRO_NAME = "Stone Ocean Gateway"
MAINTAINER = "Aung Khant Maw <aungkhantmaw64@gmail.com>"

INIT_MANAGER = "systemd"

# Replaces the Poky defaults (x11, wayland, opengl, audio, wifi, ...).
DISTRO_FEATURES_DEFAULTS = "acl bluetooth ext2 ipv4 ipv6 ldconfig seccomp usbhost vfat xattr"

PACKAGE_CLASSES = "package_ipk"

hostname:pn-base-files = "stone-ocean-gw"
