# bluetooth-meshd does its mesh crypto through the kernel's AF_ALG
# sockets (via ell): AES-CCM (algif_aead), AES-CMAC (algif_hash) and
# AES-ECB (algif_skcipher).
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_AEAD=y
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_ECB=y
